<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404.html workaround for SPA routing.
      // Derive the repo base path from the current URL (e.g. /trans-mgmt-ui/verify-email → /trans-mgmt-ui).
      const search = window.location.search;
      const hash = window.location.hash;
      const parts = window.location.pathname.split('/').filter(Boolean);
      const basePath = parts.length > 0 ? '/' + parts[0] : '';

      window.location.replace(basePath + '/index.html' + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
