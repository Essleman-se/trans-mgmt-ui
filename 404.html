<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404.html workaround for SPA routing.
      // Preserve the intended route (e.g. /reset-password, /verify-email) when redirecting to index.html.
      const pathname = window.location.pathname;
      const hash = window.location.hash;
      const parts = pathname.split('/').filter(Boolean);
      const basePath = parts.length > 0 ? '/' + parts[0] : '';
      const routeParts = parts.slice(1);
      const route = routeParts.length > 0 ? '/' + routeParts.join('/') : '';

      const params = new URLSearchParams(window.location.search);
      if (route && route !== '/index.html') {
        params.set('__spa_path', route);
      }
      const newSearch = params.toString() ? '?' + params.toString() : '';

      window.location.replace(basePath + '/index.html' + newSearch + hash);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
